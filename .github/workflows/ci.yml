name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      # The trailing "# vX" is for humans; Dependabot bumps the SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Validate manifest.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          echo "manifest.json parsed OK"

      - name: Syntax-check all extension JavaScript
        run: |
          set -euo pipefail
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "all extension JS parsed OK"
